apiVersion: v1
kind: Service
metadata:
  name: mi-service
  labels:
    app: mi-aplicacion
    environment: desarrollo
spec:
  selector:
    app: mi-aplicacion
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 80
  - name: https
    protocol: TCP
    port: 443
    targetPort: 443
  type: ClusterIP
  sessionAffinity: None